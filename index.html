<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quick Obsidian" />
  <title>Quick Obsidian</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Capture screen ===== -->
  <main id="capture" class="screen">
    <header class="topbar">
      <h1 class="brand">Quick&nbsp;Obsidian</h1>
      <button id="open-settings" class="icon-btn" aria-label="設定">⚙️</button>
    </header>

    <form id="note-form" class="editor" autocomplete="off">
      <div class="mode-switch" role="tablist">
        <button type="button" class="mode-tab is-active" data-mode="new" role="tab">新規ノート</button>
        <button type="button" class="mode-tab" data-mode="append" role="tab">デイリーに追記</button>
      </div>

      <input id="title" class="title-input" type="text" placeholder="タイトル（空ならファイル名は日時）" />

      <textarea id="body" class="body-input" placeholder="ここにメモを Markdown で…" autofocus></textarea>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div class="actions">
        <button id="clear-btn" type="button" class="btn ghost">クリア</button>
        <button id="save-btn" type="submit" class="btn primary">Obsidian に保存</button>
      </div>
    </form>

    <div id="queue-banner" class="queue-banner hidden">
      <span id="queue-text"></span>
      <button id="retry-btn" class="btn small">今すぐ再送</button>
    </div>
  </main>

  <!-- ===== Settings screen ===== -->
  <section id="settings" class="screen hidden">
    <header class="topbar">
      <button id="close-settings" class="icon-btn" aria-label="戻る">←</button>
      <h1 class="brand">設定</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <form id="settings-form" class="settings-body" autocomplete="off">
      <p class="section-label">Cloudflare R2（Remotely Save の同期先）</p>

      <label class="field">
        <span class="label">S3 API Endpoint</span>
        <input id="cfg-endpoint" type="url" placeholder="https://xxxx.r2.cloudflarestorage.com" />
        <small class="hint">R2の「S3 API」URL。バケット名は含めず、ドメインまで。</small>
      </label>

      <label class="field">
        <span class="label">バケット名</span>
        <input id="cfg-bucket" type="text" placeholder="obsidian-vault" />
      </label>

      <label class="field">
        <span class="label">Access Key ID</span>
        <input id="cfg-access" type="text" placeholder="R2 のアクセスキーID" />
      </label>

      <label class="field">
        <span class="label">Secret Access Key</span>
        <input id="cfg-secret" type="password" placeholder="R2 のシークレットキー" />
        <small class="hint">端末内 (localStorage) にのみ保存されます。</small>
      </label>

      <label class="field">
        <span class="label">リモートのプレフィックス（任意）</span>
        <input id="cfg-prefix" type="text" placeholder="（通常は空欄）" />
        <small class="hint">Remotely Saveで「リモートの基準フォルダ」を設定している場合のみ入力。</small>
      </label>

      <p class="section-label">メモの保存先</p>

      <label class="field">
        <span class="label">新規ノートの保存フォルダ</span>
        <input id="cfg-folder" type="text" placeholder="Inbox" />
        <small class="hint">Vault内の相対パス。空ならルート直下。</small>
      </label>

      <label class="field">
        <span class="label">デイリーノートのパス書式</span>
        <input id="cfg-daily" type="text" placeholder="Daily/YYYY-MM-DD.md" />
        <small class="hint"><code>YYYY MM DD HH mm</code> が日時に置換されます。</small>
      </label>

      <label class="field checkbox">
        <input id="cfg-timestamp" type="checkbox" />
        <span>追記時に時刻見出し (<code>- HH:mm</code>) を付ける</span>
      </label>

      <div class="actions">
        <button id="test-btn" type="button" class="btn ghost">接続テスト</button>
        <button id="save-settings" type="submit" class="btn primary">保存</button>
      </div>
      <div id="settings-status" class="status" role="status" aria-live="polite"></div>
    </form>

    <footer class="settings-footer">
      <p>メモはR2に直接保存され、ObsidianのRemotely Save同期で取り込まれます。Remotely Saveの暗号化は<strong>オフ</strong>にしてください。</p>
    </footer>
  </section>

  <script src="js/s3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
